<!DOCTYPE html>
<html lang="pt-BR" data-tema="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — Razão</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-pagina="admin" data-titulo="Painel Administrativo" data-subtitulo="Visão geral do sistema">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="conteudo">
      <header class="topo" id="topo"></header>

      <main class="pagina">
        <section class="grade-cards" id="cards-admin"></section>

        <div class="abas-admin">
          <button class="aba-admin aba-admin--ativa" data-aba="usuarios">Usuários</button>
          <button class="aba-admin" data-aba="categorias">Categorias</button>
        </div>

        <!-- Aba: usuários -->
        <div class="card painel-aba" id="aba-usuarios">
          <div class="tabela-wrap">
            <table class="tabela">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Tipo</th>
                  <th>Cadastro</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="corpo-tabela-usuarios"></tbody>
            </table>
          </div>
        </div>

        <!-- Aba: categorias -->
        <div class="card painel-aba" id="aba-categorias" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <p style="color:var(--cor-texto-suave); font-size:0.85rem; max-width:460px;">
              Gerenciamento de categorias (demonstração de interface). As categorias padrão do sistema
              são usadas nos formulários de receitas e despesas.
            </p>
            <button class="botao botao--primario" id="botao-nova-categoria" style="white-space:nowrap;">+ Nova categoria</button>
          </div>

          <h4 style="font-size:0.85rem; margin-bottom:10px; color:var(--cor-texto-suave);">Categorias de despesa</h4>
          <div class="lista-categorias" id="lista-categorias-despesa"></div>

          <h4 style="font-size:0.85rem; margin:20px 0 10px; color:var(--cor-texto-suave);">Categorias de receita</h4>
          <div class="lista-categorias" id="lista-categorias-receita"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal: nova categoria (demonstração) -->
  <div class="modal-fundo" id="modal-categoria">
    <div class="modal" style="max-width:380px;">
      <div class="modal-cabecalho">
        <h3>Nova categoria</h3>
        <button class="modal-fechar" data-fechar-modal="modal-categoria">✕</button>
      </div>
      <form id="form-categoria">
        <div class="campo" id="campo-categoria-nome">
          <label for="categoria-nome">Nome da categoria</label>
          <input type="text" id="categoria-nome" required>
          <span class="campo-erro">Informe um nome.</span>
        </div>
        <div class="campo">
          <label for="categoria-tipo">Aplicar em</label>
          <select id="categoria-tipo">
            <option value="despesa">Despesas</option>
            <option value="receita">Receitas</option>
          </select>
        </div>
        <div class="modal-rodape">
          <button type="button" class="botao botao--secundario" data-fechar-modal="modal-categoria">Cancelar</button>
          <button type="submit" class="botao botao--primario">Adicionar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
